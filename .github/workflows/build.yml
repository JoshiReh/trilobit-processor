# Builds the app for macOS and Windows, runs the tests on both, and attaches the ZIPs to a
# GitHub release. Runs when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0)
# or by hand under Actions -> Build -> Run workflow (then the ZIPs are only kept as artifacts).
name: Build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            zip: TrilobitProcessor-mac.zip
          - os: windows-latest
            zip: TrilobitProcessor-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install numpy pyinstaller tkinterdnd2 pillow
      - name: Test
        run: python tests/test_pipeline.py "${{ runner.temp }}/trilobit_tests"
        shell: bash
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name "Trilobit Processor" \
            --osx-bundle-identifier org.trilobit.processor --icon assets/icon.icns \
            --collect-all tkinterdnd2 app.py
          ditto -c -k --keepParent "dist/Trilobit Processor.app" "${{ matrix.zip }}"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "Trilobit Processor" `
            --icon assets/icon.png --collect-all tkinterdnd2 app.py
          Compress-Archive -Path "dist/Trilobit Processor" -DestinationPath "${{ matrix.zip }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip }}
